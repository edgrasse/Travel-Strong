<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Strong</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travel Strong">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3D2B1F;
            --accent: #C4773B;
            --light: #FAF7F2;
            --neutral: #9A8B7E;
            --success: #6B9E7F;
            --warning: #D4A574;
            --error: #C65D5D;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light);
            color: var(--primary);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p { font-size: 0.9rem; opacity: 0.9; }

        .container { display: flex; max-width: 1400px; margin: 0 auto; }

        nav {
            width: 200px;
            background: white;
            padding: 2rem 1rem;
            border-right: 1px solid #e0e0e0;
            min-height: calc(100vh - 120px);
        }

        nav button {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            text-align: left;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        nav button:hover { background: var(--light); }

        nav button.active {
            background: var(--light);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        main { flex: 1; padding: 2rem; }

        .view { display: none; }
        .view.active { display: block; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--accent);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        h3 { font-size: 1.2rem; margin-top: 1.5rem; margin-bottom: 0.75rem; }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        button:hover { background: #b8652e; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .loading { text-align: center; padding: 2rem; color: var(--neutral); }

        .msg-error {
            background: #ffe0e0;
            color: var(--error);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .msg-success {
            background: #e0ffe0;
            color: var(--success);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .question {
            background: var(--light);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .workout-activity {
            background: var(--light);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--success);
        }

        .workout-activity h4 { margin-bottom: 0.5rem; }

        .meta { display: flex; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .meta-item { font-size: 0.9rem; color: var(--neutral); }

        /* ── Chat UI ── */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            background: var(--light);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .chat-bubble.coach {
            background: white;
            border: 1px solid #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .chat-bubble.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .chat-bubble.thinking {
            background: white;
            border: 1px solid #e0e0e0;
            align-self: flex-start;
            color: var(--neutral);
            font-style: italic;
        }

        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-area textarea {
            flex: 1;
            padding: 0.6rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            min-height: 44px;
            max-height: 120px;
            resize: none;
        }

        .chat-input-area button {
            align-self: flex-end;
            padding: 0.6rem 1.25rem;
            white-space: nowrap;
        }

        .chat-hint {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--neutral);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .container { flex-direction: column; }

            nav {
                width: 100%;
                min-height: unset;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                display: flex;
                overflow-x: auto;
                padding: 0.75rem 0;
            }

            nav button {
                white-space: nowrap;
                flex: 0 0 auto;
                padding: 0.75rem 1rem;
                margin-right: 0.5rem;
                margin-bottom: 0;
            }

            header h1 { font-size: 1.75rem; }
            main { padding: 1rem; }
            .chat-container { height: 420px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Travel Strong</h1>
        <p>AI-Adaptive Fitness Training for Scandinavia &amp; Ireland</p>
    </header>

    <div class="container">
        <nav id="navigation">
            <button class="nav-btn active" data-view="assessment">Initial Assessment</button>
            <button class="nav-btn" data-view="checkin">Morning Check-In</button>
            <button class="nav-btn" data-view="workout">Today's Workout</button>
            <button class="nav-btn" data-view="history">History</button>
            <button class="nav-btn" data-view="settings">Settings</button>
        </nav>

        <main id="main-content">
            <div id="assessment-view" class="view active">
                <div class="card">
                    <h2>Initial Assessment</h2>
                    <div id="assessment-content"><p class="loading">Loading...</p></div>
                </div>
            </div>

            <div id="checkin-view" class="view">
                <div class="card">
                    <h2>Morning Check-In</h2>
                    <div id="checkin-content"><p class="loading">Loading...</p></div>
                </div>
            </div>

            <div id="workout-view" class="view">
                <div class="card">
                    <h2>Today's Workout</h2>
                    <div id="workout-content"><p class="loading">Loading...</p></div>
                </div>
            </div>

            <div id="history-view" class="view">
                <div class="card">
                    <h2>History</h2>
                    <div id="history-content"><p class="loading">Loading...</p></div>
                </div>
            </div>

            <div id="settings-view" class="view">
                <div class="card">
                    <h2>Settings</h2>
                    <div id="settings-content"><p>Profile information and app settings.</p></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://viprflxaudxjwsvytrnn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcHJmbHhhdWR4andzdnl0cm5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Nzc0NjcsImV4cCI6MjA5MDE1MzQ2N30.GCaasqLjpBvcARUO7poDTKH_bvQfasbAX9yLKOeKGK0';
        const WORKER_URL = 'https://grasse-apps-proxy.ed-53c.workers.dev';
        const APP_ID = 'travelstrong';

        let supabaseClient = null;
        let appState = {
            profile: null,
            assessmentAnswers: [],
            todayWorkout: null,
            todayCheckin: null,
            allWorkouts: [],
            allCheckins: [],
            currentDate: new Date().toISOString().split('T')[0],
            checkinTranscript: []
        };

        // ── Init ──────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            setupNavigation();
            await loadData();
            renderAssessment();
        });

        // ── Navigation ────────────────────────────────────────────────────────
        function setupNavigation() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    switchView(e.target.dataset.view, e.target);
                });
            });
        }

        function switchView(viewName, target) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewName + '-view').classList.add('active');
            if (target) target.classList.add('active');
            if (viewName === 'assessment') renderAssessment();
            if (viewName === 'checkin')    renderCheckin();
            if (viewName === 'workout')    renderWorkout();
            if (viewName === 'history')    renderHistory();
        }

        // ── Load Data ─────────────────────────────────────────────────────────
        async function loadData() {
            try {
                const { data: profileData } = await supabaseClient
                    .from('travelstrongusers')
                    .select('*')
                    .limit(1)
                    .single();

                if (profileData) {
                    appState.profile = profileData;
                    appState.assessmentAnswers = [
                        profileData.answer_1 || '',
                        profileData.answer_2 || '',
                        profileData.answer_3 || '',
                        profileData.answer_4 || '',
                        profileData.answer_5 || ''
                    ];
                }

                const { data: workoutData } = await supabaseClient
                    .from('travelstrongworkouts')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allWorkouts = workoutData || [];
                appState.todayWorkout = appState.allWorkouts.find(w => w.date === appState.currentDate) || null;

                const { data: checkinData } = await supabaseClient
                    .from('travelstrongcheckins')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allCheckins = checkinData || [];
                appState.todayCheckin = appState.allCheckins.find(c => c.date === appState.currentDate) || null;

            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        // ── Assessment View ───────────────────────────────────────────────────
        function renderAssessment() {
            const content = document.getElementById('assessment-content');
            if (!appState.assessmentAnswers.some(a => a)) {
                content.innerHTML = '<p>No assessment data found.</p>';
                return;
            }
            const questions = [
                'How are your knees and hips feeling these days?',
                "Let's talk about your lower back and hips. Do you experience any lower back stiffness or aching?",
                "Let's talk about your ankles and feet. Do your ankles feel stable on uneven ground?",
                'When you think about those long walking days, how does your cardiovascular system hold up?',
                'Are there any upper body issues I should know about - shoulder, elbow, wrist?'
            ];
            let html = '';
            questions.forEach((q, i) => {
                html += '<div class="question"><p><strong>Q' + (i+1) + ': ' + q + '</strong></p><p>' + appState.assessmentAnswers[i] + '</p></div>';
            });
            content.innerHTML = html;
        }

        // ── Morning Check-In (Interactive Chat) ───────────────────────────────
        function renderCheckin() {
            const content = document.getElementById('checkin-content');

            // Already completed today
            if (appState.todayCheckin && appState.todayCheckin.completed) {
                let html = '<div class="msg-success">You have already checked in today!</div>';
                if (appState.todayCheckin.summary) {
                    html += '<div class="question"><p><strong>Today\'s check-in summary:</strong></p><p>' + appState.todayCheckin.summary + '</p></div>';
                }
                content.innerHTML = html;
                return;
            }

            // Find yesterday's workout for context
            const yesterday = new Date(appState.currentDate);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayDate = yesterday.toISOString().split('T')[0];
            const yesterdayWorkout = appState.allWorkouts.find(w => w.date === yesterdayDate);

            // Start the chat
            appState.checkinTranscript = [];

            content.innerHTML = '<div class="chat-container"><div class="chat-messages" id="chat-messages"></div><div class="chat-input-area"><textarea id="chat-input" placeholder="Type your response..." rows="1"></textarea><button id="chat-send" onclick="sendCheckinMessage()">Send</button></div></div><p class="chat-hint">Chat with your coach. When you are done, your workout will generate automatically.</p>';

            // Attach enter key handler
            const input = document.getElementById('chat-input');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendCheckinMessage();
                }
            });
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Opening message
            const yesterdayTitle = yesterdayWorkout ? yesterdayWorkout.title : 'your recent workout';
            const name = appState.profile && appState.profile.name ? appState.profile.name : 'Ed';
            const openingMessage = 'Good morning, ' + name + '! Yesterday you did "' + yesterdayTitle + '". How did it go? Tell me anything — what felt good, what was hard, any soreness or surprises.';
            appendCoachMessage(openingMessage);
            appState.checkinTranscript.push({ role: 'assistant', content: openingMessage });
        }

        function appendCoachMessage(text) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const div = document.createElement('div');
            div.className = 'chat-bubble coach';
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendUserMessage(text) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const div = document.createElement('div');
            div.className = 'chat-bubble user';
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendThinking(msg) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const existing = document.getElementById('thinking-bubble');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'chat-bubble thinking';
            div.id = 'thinking-bubble';
            div.textContent = msg || 'Coach is thinking...';
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinking-bubble');
            if (el) el.remove();
        }

        async function sendCheckinMessage() {
            const input = document.getElementById('chat-input');
            if (!input) return;
            const userText = input.value.trim();
            if (!userText) return;

            input.value = '';
            input.style.height = 'auto';
            appendUserMessage(userText);
            appState.checkinTranscript.push({ role: 'user', content: userText });

            input.disabled = true;
            document.getElementById('chat-send').disabled = true;
            appendThinking('Coach is thinking...');

            try {
                const response = await callClaudeChat(buildCheckinSystemPrompt(), appState.checkinTranscript);
                removeThinking();

                if (response.includes('[READY]')) {
                    const cleanResponse = response.replace('[READY]', '').trim();
                    if (cleanResponse) {
                        appendCoachMessage(cleanResponse);
                        appState.checkinTranscript.push({ role: 'assistant', content: cleanResponse });
                    }
                    await finishCheckin();
                } else {
                    appendCoachMessage(response);
                    appState.checkinTranscript.push({ role: 'assistant', content: response });
                    input.disabled = false;
                    document.getElementById('chat-send').disabled = false;
                    input.focus();
                }
            } catch (err) {
                removeThinking();
                appendCoachMessage('Sorry, I had trouble connecting. Please try again.');
                input.disabled = false;
                document.getElementById('chat-send').disabled = false;
            }
        }

        function buildCheckinSystemPrompt() {
            const assessment = appState.assessmentAnswers.join('\n\n');

            const recentSummaries = appState.allCheckins
                .filter(c => c.completed && c.summary)
                .slice(0, 7)
                .reverse()
                .map(c => c.date + ': ' + c.summary)
                .join('\n');

            const yesterday = new Date(appState.currentDate);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayDate = yesterday.toISOString().split('T')[0];
            const yesterdayWorkout = appState.allWorkouts.find(w => w.date === yesterdayDate);

            return 'You are an expert fitness coach conducting a morning check-in with Ed, who is preparing for 11 days of walking in Scandinavia and 7 days of golf in Ireland.\n\nINITIAL ASSESSMENT:\n' + assessment + '\n\nRECENT CHECK-IN SUMMARIES:\n' + (recentSummaries || 'No prior check-ins yet') + '\n\nYESTERDAY\'S WORKOUT: ' + (yesterdayWorkout ? yesterdayWorkout.title : 'No workout on record') + '\n\nYOUR JOB:\n- Have a natural, supportive conversation about how Ed is feeling\n- Ask about soreness, energy, sleep, how specific exercises felt\n- Probe follow-up questions based on his answers - one question at a time\n- After 4-6 exchanges when you have enough information, give a warm closing then add [READY] at the very end\n- Keep messages concise and conversational\n- Remember: NO PUSHUPS (left shoulder subscapularis tear), bodyweight only';
        }

        async function finishCheckin() {
            appendThinking('Saving your check-in and generating your workout...');

            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');
            if (input) input.disabled = true;
            if (sendBtn) sendBtn.disabled = true;

            try {
                // Generate summary
                const summary = await generateCheckinSummary();

                // Save to Supabase
                const checkinData = {
                    date: appState.currentDate,
                    workout_id: appState.todayWorkout ? appState.todayWorkout.date : null,
                    transcript: appState.checkinTranscript,
                    summary: summary,
                    completed: true,
                    updated_at: new Date().toISOString()
                };

                const { error } = await supabaseClient
                    .from('travelstrongcheckins')
                    .upsert([checkinData], { onConflict: 'date' });

                if (error) console.error('Error saving check-in:', error);

                // Update local state
                appState.todayCheckin = checkinData;
                appState.allCheckins = appState.allCheckins.filter(c => c.date !== appState.currentDate);
                appState.allCheckins.unshift(checkinData);

                // Generate today's workout
                await generateTodayWorkout();

                // Switch to workout view
                const workoutBtn = document.querySelector('[data-view="workout"]');
                switchView('workout', workoutBtn);

            } catch (err) {
                console.error('Error finishing check-in:', err);
                removeThinking();
                appendCoachMessage('Something went wrong saving your check-in. Please refresh and try again.');
            }
        }

        async function generateCheckinSummary() {
            const transcriptText = appState.checkinTranscript
                .map(m => (m.role === 'user' ? 'Ed' : 'Coach') + ': ' + m.content)
                .join('\n');

            const summary = await callClaude('Summarize this morning check-in in 2-3 sentences: what Ed reported about soreness, energy, and how the previous workout felt. Be specific.\n\n' + transcriptText);
            return summary.trim();
        }

        // ── Today's Workout ───────────────────────────────────────────────────
        function renderWorkout() {
            const content = document.getElementById('workout-content');

            if (!appState.todayWorkout) {
                content.innerHTML = '<p class="loading">Generating your personalized workout...</p>';
                generateTodayWorkout();
                return;
            }

            let activities = [];
            try {
                activities = typeof appState.todayWorkout.activities === 'string'
                    ? JSON.parse(appState.todayWorkout.activities)
                    : (appState.todayWorkout.activities || []);
            } catch (e) { activities = []; }

            let html = '<button onclick="copyWorkout()" style="margin-bottom:1.5rem;width:100%;">Copy Workout to Clipboard</button>';
            html += '<h3>' + appState.todayWorkout.title + '</h3>';
            html += '<p style="margin-bottom:1.5rem;">' + appState.todayWorkout.overview + '</p>';

            activities.forEach(function(activity) {
                html += '<div class="workout-activity">';
                html += '<h4>' + activity.name + '</h4>';
                html += '<div class="meta"><div class="meta-item">&#9201; ' + activity.duration + '</div></div>';
                html += '<p><strong>What to do:</strong> ' + activity.description + '</p>';
                html += '<p><strong>Form:</strong> ' + activity.form + '</p>';
                if (activity.videoUrl) {
                    html += '<p style="margin-top:0.5rem;"><a href="' + activity.videoUrl + '" target="_blank">View form video</a></p>';
                }
                html += '</div>';
            });

            content.innerHTML = html;
        }

        function copyWorkout() {
            if (!appState.todayWorkout) return;
            let activities = [];
            try {
                activities = typeof appState.todayWorkout.activities === 'string'
                    ? JSON.parse(appState.todayWorkout.activities)
                    : (appState.todayWorkout.activities || []);
            } catch (e) { activities = []; }

            const lines = [appState.todayWorkout.title].concat(activities.map(a => '- ' + a.name + ' (' + a.duration + ')'));
            navigator.clipboard.writeText(lines.join('\n')).then(function() {
                const btn = document.querySelector('[onclick="copyWorkout()"]');
                if (btn) {
                    const orig = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(function() { btn.textContent = orig; }, 2000);
                }
            });
        }

        async function generateTodayWorkout() {
            try {
                const prompt = buildWorkoutPrompt();
                const response = await callClaude(prompt);

                const titleMatch    = response.match(/WORKOUT_TITLE:\s*(.+?)(?=\nOVERVIEW:|$)/s);
                const overviewMatch = response.match(/OVERVIEW:\s*(.+?)(?=\nACTIVITIES:|$)/s);
                const activitiesMatch = response.match(/ACTIVITIES:\s*([\s\S]+?)(?=\nQUESTIONS:|$|\n\n$)/);

                const title    = titleMatch    ? titleMatch[1].trim()    : "Today's Workout";
                const overview = overviewMatch ? overviewMatch[1].trim() : 'Personalized workout';

                const activitiesText = activitiesMatch ? activitiesMatch[1].trim() : '';
                const activityBlocks = activitiesText.split(/\n(?=-)/).filter(function(a) { return a.trim(); });
                const activities = activityBlocks.map(function(block) {
                    const lines = block.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
                    return {
                        name:        (lines[0] || 'Activity').replace(/^-\s*/, ''),
                        duration:    lines[1] || '10 min',
                        description: lines[2] || 'Do this exercise',
                        form:        lines[3] || 'Proper form',
                        videoUrl:    null
                    };
                });

                const workoutData = {
                    date:       appState.currentDate,
                    title:      title,
                    overview:   overview,
                    activities: JSON.stringify(activities),
                    created_at: new Date().toISOString()
                };

                await supabaseClient
                    .from('travelstrongworkouts')
                    .upsert([workoutData], { onConflict: 'date' });

                appState.todayWorkout = workoutData;
                appState.allWorkouts = appState.allWorkouts.filter(function(w) { return w.date !== appState.currentDate; });
                appState.allWorkouts.unshift(workoutData);

                renderWorkout();

            } catch (err) {
                console.error('Error generating workout:', err);
                const content = document.getElementById('workout-content');
                if (content) content.innerHTML = '<p class="msg-error">Error generating workout. Please try again.</p>';
            }
        }

        function buildWorkoutPrompt() {
            const assessment = appState.assessmentAnswers.join('\n\n');

            const checkinHistory = appState.allCheckins
                .filter(function(c) { return c.completed && c.summary; })
                .slice(0, 14)
                .reverse()
                .map(function(c) { return c.date + ': ' + c.summary; })
                .join('\n');

            const todayTranscript = (appState.todayCheckin && appState.todayCheckin.transcript)
                ? appState.todayCheckin.transcript
                    .map(function(m) { return (m.role === 'user' ? 'Ed' : 'Coach') + ': ' + m.content; })
                    .join('\n')
                : null;

            const name       = (appState.profile && appState.profile.name)           || 'Ed';
            const stats      = (appState.profile && appState.profile.stats)           || 'Unknown';
            const fitness    = (appState.profile && appState.profile.fitness_level)   || 'Unknown';
            const departure  = (appState.profile && appState.profile.departure_date)  || 'Unknown';

            return 'You are an expert fitness coach preparing ' + name + ' for 11 days of walking in Scandinavia and 7 days of golf in Ireland.\n\nPROFILE:\n- Name: ' + name + '\n- Stats: ' + stats + '\n- Fitness Level: ' + fitness + '\n- Departure: ' + departure + '\n\nINITIAL ASSESSMENT:\n' + assessment + '\n\nCHECK-IN HISTORY (summaries):\n' + (checkinHistory || 'No prior check-ins yet - this is day 1') + '\n\n' + (todayTranscript ? "TODAY'S CHECK-IN CONVERSATION:\n" + todayTranscript + '\n\n' : '') + 'REQUIREMENTS:\n1. Generate a 25-30 minute personalized workout\n2. Bodyweight only - NO PUSHUPS (left shoulder subscapularis tear)\n3. Emphasize: ankle mobility, knee stability, core, hip flexibility\n4. Include a walking recommendation\n5. Adapt based on what Ed reported in today\'s check-in\n\nReturn in this exact plain text format:\n\nWORKOUT_TITLE: [title]\n\nOVERVIEW: [one sentence]\n\nACTIVITIES:\n- [Activity Name]\n[Duration]\n[What to do]\n[Form tips]\n\n- [Activity Name]\n[Duration]\n[What to do]\n[Form tips]\n\n(4-6 activities, 25-30 minutes total)\n';
        }

        // ── Claude API ────────────────────────────────────────────────────────
        async function callClaude(prompt) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appId: APP_ID,
                    method: 'CLAUDE_API',
                    claudeMethod: 'advisorChat',
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await response.json();
            return data.result || '';
        }

        async function callClaudeChat(systemPrompt, messages) {
            // Prepend system prompt as first message to ensure worker compatibility
            const fullMessages = [
                { role: 'user', content: systemPrompt + '\n\n---\n\nBegin the conversation based on the messages that follow.' },
                { role: 'assistant', content: 'Understood. I am ready to conduct the morning check-in.' }
            ].concat(messages);

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appId: APP_ID,
                    method: 'CLAUDE_API',
                    claudeMethod: 'advisorChat',
                    messages: fullMessages
                })
            });
            const data = await response.json();
            return data.result || '';
        }

        // ── History ───────────────────────────────────────────────────────────
        function renderHistory() {
            const content = document.getElementById('history-content');

            if (!appState.allWorkouts.length) {
                content.innerHTML = '<p>No workout history yet.</p>';
                return;
            }

            let html = '';
            appState.allWorkouts.forEach(function(workout) {
                const checkin = appState.allCheckins.find(function(c) {
                    return c.date === workout.date && c.completed;
                });
                html += '<div class="card">';
                html += '<h3>' + workout.date + '</h3>';
                html += '<p><strong>' + workout.title + '</strong></p>';
                html += '<p style="margin-bottom:0.75rem;">' + workout.overview + '</p>';
                if (checkin && checkin.summary) {
                    html += '<div class="question"><p><strong>Check-in:</strong></p><p>' + checkin.summary + '</p></div>';
                } else {
                    html += '<p><em>No check-in yet</em></p>';
                }
                html += '</div>';
            });

            content.innerHTML = html;
        }

        // ── Service Worker ────────────────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        }
    </script>
</body>
</html>
