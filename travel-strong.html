    <style>
        :root {
            --primary: #1B3A6B;
            --accent: #E85A1A;
            --light: #F0F4FF;
            --neutral: #7A8BA0;
            --success: #2ECC71;
            --warning: #F39C12;
            --error: #E74C3C;
            --dark: #1A1A2A;
            --white: #FFFFFF;
            --card-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #0F2447 100%);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(27,58,107,0.3);
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        header h1 span { color: var(--accent); }

        header p { font-size: 0.85rem; opacity: 0.8; letter-spacing: 0.5px; }

        .location-bar {
            background: var(--primary);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
        }

        .location-bar span { color: var(--accent); font-weight: 600; }

        .container { display: flex; max-width: 1400px; margin: 0 auto; }

        nav {
            width: 210px;
            background: var(--white);
            padding: 1.5rem 1rem;
            border-right: 1px solid #E0E8F0;
            min-height: calc(100vh - 110px);
        }

        nav button {
            display: block;
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 0.35rem;
            background: none;
            border: none;
            color: var(--dark);
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }

        nav button:hover { background: var(--light); color: var(--primary); }

        nav button.active {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        main { flex: 1; padding: 2rem; }

        .view { display: none; }
        .view.active { display: block; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 16px rgba(27,58,107,0.08);
            border-top: 4px solid var(--accent);
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--primary);
        }

        h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--dark);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        button:hover { background: #D04A0E; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: var(--primary);
        }
        .btn-secondary:hover { background: #142D54; }

        .loading { text-align: center; padding: 2rem; color: var(--neutral); }

        .msg-error {
            background: #FEE8E8;
            color: var(--error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--error);
        }

        .msg-success {
            background: #E8FAF0;
            color: #1A7A45;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--success);
        }

        .question {
            background: var(--light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--primary);
        }

        .workout-activity {
            background: var(--light);
            padding: 1.25rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent);
        }

        .workout-activity h4 { margin-bottom: 0.5rem; font-size: 1.05rem; }

        .meta { display: flex; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .meta-item {
            font-size: 0.85rem;
            color: var(--neutral);
            background: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid #E0E8F0;
        }

        .day-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        /* ── Exercise Checkbox List ── */
        .exercise-checklist {
            background: var(--light);
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .exercise-checklist label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid #E0E8F0;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .exercise-checklist label:last-child { border-bottom: none; }

        .exercise-checklist input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ── Chat UI ── */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 520px;
            border: 1px solid #E0E8F0;
            border-radius: 12px;
            overflow: hidden;
            background: var(--light);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.55;
            font-size: 0.95rem;
        }

        .chat-bubble.coach {
            background: white;
            border: 1px solid #E0E8F0;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .chat-bubble.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .chat-bubble.thinking {
            background: white;
            border: 1px solid #E0E8F0;
            align-self: flex-start;
            color: var(--neutral);
            font-style: italic;
        }

        /* Inline checkbox widget inside chat */
        .chat-checklist {
            background: white;
            border: 1px solid #E0E8F0;
            border-radius: 10px;
            padding: 1rem;
            align-self: flex-start;
            max-width: 85%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .chat-checklist p {
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .chat-checklist label {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.4rem 0;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #F0F4FF;
        }

        .chat-checklist label:last-of-type { border-bottom: none; }

        .chat-checklist input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .chat-checklist button {
            margin-top: 0.75rem;
            width: 100%;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem;
            background: white;
            border-top: 1px solid #E0E8F0;
        }

        .chat-input-area textarea {
            flex: 1;
            padding: 0.6rem 0.75rem;
            border: 1px solid #E0E8F0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            min-height: 44px;
            max-height: 120px;
            resize: none;
            background: var(--light);
        }

        .chat-input-area button {
            align-self: flex-end;
            padding: 0.6rem 1.25rem;
            white-space: nowrap;
        }

        .chat-hint {
            margin-top: 0.75rem;
            font-size: 0.82rem;
            color: var(--neutral);
        }

        /* ── Stat Cards ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--light);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            border: 1px solid #E0E8F0;
        }

        .stat-card .stat-num {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--neutral);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .container { flex-direction: column; }

            nav {
                width: 100%;
                min-height: unset;
                border-right: none;
                border-bottom: 1px solid #E0E8F0;
                display: flex;
                overflow-x: auto;
                padding: 0.5rem;
                gap: 0.25rem;
            }

            nav button {
                white-space: nowrap;
                flex: 0 0 auto;
                padding: 0.6rem 1rem;
                margin-bottom: 0;
            }

            header h1 { font-size: 1.8rem; }
            main { padding: 1rem; }
            .chat-container { height: 440px; }
        }
    </style>
</head>

            <!-- Profile -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://viprflxaudxjwsvytrnn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcHJmbHhhdWR4andzdnl0cm5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Nzc0NjcsImV4cCI6MjA5MDE1MzQ2N30.GCaasqLjpBvcARUO7poDTKH_bvQfasbAX9yLKOeKGK0';
        const WORKER_URL = 'https://grasse-apps-proxy.ed-53c.workers.dev';
        const APP_ID = 'travelstrong';

        let supabaseClient = null;
        let appState = {
            profile: null,
            assessmentAnswers: [],
            currentLocation: null,       // { location, days_planned, start_date, end_date }
            todayWorkout: null,
            todayCheckin: null,
            yesterdayWorkout: null,
            allWorkouts: [],
            allCheckins: [],
            currentDate: new Date().toISOString().split('T')[0],
            checkinTranscript: [],
            showingChecklist: false      // true when exercise checkbox is visible in chat
        };

        // Equipment by location
        const EQUIPMENT = {
            home: 'Dumbbells (2.5lb to 50lb), treadmill, pool, outdoor bike, bodyweight',
            karmel: 'Kettlebells (5lb, 10lb, 15lb), outdoor bike, bodyweight'
        };

        // Workout split cycle
        const SPLIT_CYCLE = [
            'Legs & Glutes',
            'Push — Shoulders, Chest & Triceps',
            'Pull — Back & Biceps',
            'Core & Mobility',
            'Active Recovery — Walk, Bike or Swim',
            'Full Body Compound',
            'Rest & Deep Stretch'
        ];

        // ── Init ──────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            setupNavigation();
            await loadData();
            updateLocationBar();
            renderCheckin();
        });

        // ── Navigation ────────────────────────────────────────────────────────
        function setupNavigation() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    switchView(e.target.dataset.view, e.target);
                });
            });
        }

        function switchView(viewName, target) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewName + '-view').classList.add('active');
            if (target) target.classList.add('active');
            if (viewName === 'checkin')  renderCheckin();
            if (viewName === 'workout')  renderWorkout();
            if (viewName === 'history')  renderHistory();
            if (viewName === 'profile')  renderProfile();
        }

        // ── Load Data ─────────────────────────────────────────────────────────
        async function loadData() {
            try {
                // Load profile
                const { data: profileData } = await supabaseClient
                    .from('travelstrongusers')
                    .select('*')
                    .limit(1)
                    .single();

                if (profileData) {
                    appState.profile = profileData;
                    appState.assessmentAnswers = [
                        profileData.answer_1 || '',
                        profileData.answer_2 || '',
                        profileData.answer_3 || '',
                        profileData.answer_4 || '',
                        profileData.answer_5 || ''
                    ];
                }

                // Load current location
                const { data: locationData } = await supabaseClient
                    .from('travelstronglocation')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .single();

                if (locationData) {
                    appState.currentLocation = locationData;
                }

                // Load all workouts
                const { data: workoutData } = await supabaseClient
                    .from('travelstrongworkouts')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allWorkouts = workoutData || [];
                appState.todayWorkout = appState.allWorkouts.find(w => w.date === appState.currentDate) || null;

                // Find yesterday's workout
                const yesterday = new Date(appState.currentDate);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayDate = yesterday.toISOString().split('T')[0];
                appState.yesterdayWorkout = appState.allWorkouts.find(w => w.date === yesterdayDate) || null;

                // Load all checkins
                const { data: checkinData } = await supabaseClient
                    .from('travelstrongcheckins')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allCheckins = checkinData || [];
                appState.todayCheckin = appState.allCheckins.find(c => c.date === appState.currentDate) || null;

            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        // ── Location Bar ──────────────────────────────────────────────────────
        function updateLocationBar() {
            const bar = document.getElementById('location-bar');
            if (!appState.currentLocation) {
                bar.innerHTML = '📍 Location unknown — tell your coach where you are in the morning check-in';
                return;
            }
            const loc = appState.currentLocation;
            const locName = loc.location === 'home' ? 'Home' : 'Karmel';
            const equipment = loc.location === 'home'
                ? 'Dumbbells + Treadmill + Pool'
                : 'Kettlebells + Outdoor Bike';

            // Calculate days remaining
            let daysInfo = '';
            if (loc.end_date) {
                const end = new Date(loc.end_date);
                const today = new Date(appState.currentDate);
                const daysLeft = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
                if (daysLeft > 0) daysInfo = ' &nbsp;·&nbsp; ' + daysLeft + ' day' + (daysLeft !== 1 ? 's' : '') + ' remaining';
                else if (daysLeft === 0) daysInfo = ' &nbsp;·&nbsp; Last day here';
            }
            bar.innerHTML = '📍 <span>' + locName + '</span> &nbsp;·&nbsp; ' + equipment + daysInfo;
        }

        // ── Morning Check-In ──────────────────────────────────────────────────
        function renderCheckin() {
            const content = document.getElementById('checkin-content');

            // Already completed today
            if (appState.todayCheckin && appState.todayCheckin.completed) {
                let html = '<div class="msg-success">✓ Check-in complete for today!</div>';
                if (appState.todayCheckin.summary) {
                    html += '<div class="question"><p><strong>Summary:</strong></p><p>' + appState.todayCheckin.summary + '</p></div>';
                }
                html += '<button onclick="switchView(\'workout\', document.querySelector(\'[data-view=workout]\'))" class="btn-secondary" style="margin-top:1rem;">View Today\'s Workout →</button>';
                content.innerHTML = html;
                return;
            }

            // Start chat
            appState.checkinTranscript = [];
            appState.showingChecklist = false;

            content.innerHTML = '<div class="chat-container"><div class="chat-messages" id="chat-messages"></div><div class="chat-input-area"><textarea id="chat-input" placeholder="Type your response..." rows="1"></textarea><button id="chat-send" onclick="sendCheckinMessage()">Send</button></div></div><p class="chat-hint">Chat with your coach. Your workout generates automatically when ready.</p>';

            const input = document.getElementById('chat-input');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendCheckinMessage();
                }
            });
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Opening message
            const name = (appState.profile && appState.profile.name) ? appState.profile.name : 'Ed';
            const greeting = buildOpeningMessage(name);
            appendCoachMessage(greeting);
            appState.checkinTranscript.push({ role: 'assistant', content: greeting });
        }

        function buildOpeningMessage(name) {
            const hour = new Date().getHours();
            const timeGreeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

            // Check if location needs updating
            let locationNote = '';
            if (!appState.currentLocation) {
                locationNote = " First — where are you today, home or Karmel?";
            } else {
                const loc = appState.currentLocation;
                if (loc.end_date) {
                    const end = new Date(loc.end_date);
                    const today = new Date(appState.currentDate);
                    const daysLeft = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
                    if (daysLeft <= 0) {
                        locationNote = " Looks like your time at " + (loc.location === 'home' ? 'home' : 'Karmel') + " has ended — where are you now?";
                    }
                }
            }

            // Reference yesterday's workout
            let yesterdayNote = '';
            if (appState.yesterdayWorkout) {
                yesterdayNote = ' Yesterday was "' + appState.yesterdayWorkout.title + '."';
            }

            return timeGreeting + ', ' + name + '!' + locationNote + yesterdayNote + ' How are you feeling today?';
        }

        function appendCoachMessage(text) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const div = document.createElement('div');
            div.className = 'chat-bubble coach';
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendUserMessage(text) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const div = document.createElement('div');
            div.className = 'chat-bubble user';
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendThinking(msg) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;
            const existing = document.getElementById('thinking-bubble');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'chat-bubble thinking';
            div.id = 'thinking-bubble';
            div.textContent = msg || 'Coach is thinking...';
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinking-bubble');
            if (el) el.remove();
        }

        function showExerciseChecklist(exercises) {
            const msgs = document.getElementById('chat-messages');
            if (!msgs) return;

            const div = document.createElement('div');
            div.className = 'chat-checklist';
            div.id = 'exercise-checklist';

            let html = '<p>Check what you completed:</p>';
            exercises.forEach(function(ex, i) {
                html += '<label><input type="checkbox" id="ex-' + i + '" value="' + ex + '" checked> ' + ex + '</label>';
            });
            html += '<button onclick="submitChecklist()">Done</button>';
            div.innerHTML = html;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
            appState.showingChecklist = true;
        }

        function submitChecklist() {
            const checklist = document.getElementById('exercise-checklist');
            if (!checklist) return;

            const checked = [];
            const unchecked = [];
            checklist.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
                if (cb.checked) checked.push(cb.value);
                else unchecked.push(cb.value);
            });

            checklist.remove();
            appState.showingChecklist = false;

            let response = '';
            if (unchecked.length === 0) {
                response = 'I completed all of them.';
            } else {
                response = 'I completed: ' + checked.join(', ') + '. I skipped: ' + unchecked.join(', ') + '.';
            }

            appendUserMessage(response);
            appState.checkinTranscript.push({ role: 'user', content: response });

            // Re-enable input and continue chat
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');
            if (input) input.disabled = false;
            if (sendBtn) sendBtn.disabled = false;

            // Continue the conversation
            continueCheckinChat();
        }

        async function sendCheckinMessage() {
            const input = document.getElementById('chat-input');
            if (!input || appState.showingChecklist) return;
            const userText = input.value.trim();
            if (!userText) return;

            input.value = '';
            input.style.height = 'auto';
            appendUserMessage(userText);
            appState.checkinTranscript.push({ role: 'user', content: userText });

            input.disabled = true;
            document.getElementById('chat-send').disabled = true;

            await continueCheckinChat();
        }

        async function continueCheckinChat() {
            appendThinking('Coach is thinking...');

            try {
                const response = await callClaudeChat(buildCheckinSystemPrompt(), appState.checkinTranscript);
                removeThinking();

                // Check for special tokens
                if (response.includes('[CHECKLIST]')) {
                    // Extract exercise list between [CHECKLIST] and [/CHECKLIST]
                    const match = response.match(/\[CHECKLIST\]([\s\S]*?)\[\/CHECKLIST\]/);
                    const cleanResponse = response.replace(/\[CHECKLIST\][\s\S]*?\[\/CHECKLIST\]/, '').trim();
                    if (cleanResponse) {
                        appendCoachMessage(cleanResponse);
                        appState.checkinTranscript.push({ role: 'assistant', content: cleanResponse });
                    }
                    if (match) {
                        const exercises = match[1].trim().split('\n').map(e => e.replace(/^[-•]\s*/, '').trim()).filter(e => e);
                        showExerciseChecklist(exercises);
                    }
                } else if (response.includes('[LOCATION]')) {
                    // Extract location info between [LOCATION] and [/LOCATION]
                    const match = response.match(/\[LOCATION\]([\s\S]*?)\[\/LOCATION\]/);
                    const cleanResponse = response.replace(/\[LOCATION\][\s\S]*?\[\/LOCATION\]/, '').trim();
                    if (cleanResponse) {
                        appendCoachMessage(cleanResponse);
                        appState.checkinTranscript.push({ role: 'assistant', content: cleanResponse });
                    }
                    if (match) {
                        try {
                            const locData = JSON.parse(match[1].trim());
                            await saveLocation(locData);
                        } catch (e) {
                            console.error('Error parsing location data:', e);
                        }
                    }
                    // Re-enable and continue
                    const input = document.getElementById('chat-input');
                    const sendBtn = document.getElementById('chat-send');
                    if (input) input.disabled = false;
                    if (sendBtn) sendBtn.disabled = false;
                    if (input) input.focus();
                } else if (response.includes('[READY]')) {
                    const cleanResponse = response.replace('[READY]', '').trim();
                    if (cleanResponse) {
                        appendCoachMessage(cleanResponse);
                        appState.checkinTranscript.push({ role: 'assistant', content: cleanResponse });
                    }
                    await finishCheckin();
                } else {
                    appendCoachMessage(response);
                    appState.checkinTranscript.push({ role: 'assistant', content: response });
                    const input = document.getElementById('chat-input');
                    const sendBtn = document.getElementById('chat-send');
                    if (input) input.disabled = false;
                    if (sendBtn) sendBtn.disabled = false;
                    if (input) input.focus();
                }
            } catch (err) {
                removeThinking();
                appendCoachMessage('Sorry, I had trouble connecting. Please try again.');
                const input = document.getElementById('chat-input');
                const sendBtn = document.getElementById('chat-send');
                if (input) input.disabled = false;
                if (sendBtn) sendBtn.disabled = false;
            }
        }

        async function saveLocation(locData) {
            try {
                const startDate = appState.currentDate;
                const endDate = new Date(appState.currentDate);
                endDate.setDate(endDate.getDate() + (locData.days_planned || 1) - 1);
                const endDateStr = endDate.toISOString().split('T')[0];

                const locationRecord = {
                    location: locData.location,
                    days_planned: locData.days_planned || 1,
                    start_date: startDate,
                    end_date: endDateStr
                };

                const { error } = await supabaseClient
                    .from('travelstronglocation')
                    .insert([locationRecord]);

                if (!error) {
                    appState.currentLocation = locationRecord;
                    updateLocationBar();
                }
            } catch (err) {
                console.error('Error saving location:', err);
            }
        }

        async function finishCheckin() {
            appendThinking('Saving check-in and building your workout...');

            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');
            if (input) input.disabled = true;
            if (sendBtn) sendBtn.disabled = true;

            try {
                const summary = await generateCheckinSummary();

                const checkinData = {
                    date: appState.currentDate,
                    workout_id: appState.todayWorkout ? appState.todayWorkout.date : null,
                    transcript: appState.checkinTranscript,
                    summary: summary,
                    completed: true,
                    updated_at: new Date().toISOString()
                };

                const { error } = await supabaseClient
                    .from('travelstrongcheckins')
                    .upsert([checkinData], { onConflict: 'date' });

                if (error) console.error('Error saving check-in:', error);

                appState.todayCheckin = checkinData;
                appState.allCheckins = appState.allCheckins.filter(c => c.date !== appState.currentDate);
                appState.allCheckins.unshift(checkinData);

                await generateTodayWorkout();

                const workoutBtn = document.querySelector('[data-view="workout"]');
                switchView('workout', workoutBtn);

            } catch (err) {
                console.error('Error finishing check-in:', err);
                removeThinking();
                appendCoachMessage('Something went wrong. Please refresh and try again.');

        async function generateCheckinSummary() {
            const transcriptText = appState.checkinTranscript
                .map(m => (m.role === 'user' ? 'Ed' : 'Coach') + ': ' + m.content)
                .join('\n');

            const summary = await callClaude('Summarize this morning check-in in 2-3 sentences. Cover: location, whether Ed completed yesterday\'s workout, energy/soreness, eating, and time available today.\n\n' + transcriptText);

        }

        // ── Today's Workout ───────────────────────────────────────────────────
        function formatAsBullets(text) {
            if (!text) return '';
            const sentences = text.split(/\.\s+/).map(s => s.trim()).filter(s => s.length > 0);
            if (sentences.length <= 1) return '<p>' + text + '</p>';
            return '<ul style="margin:0.5rem 0 0 1.25rem;line-height:1.7;">' +
                sentences.map(function(s) {
                    const line = s.endsWith('.') ? s : s + '.';
                    return '<li style="margin-bottom:0.4rem;">' + line + '</li>';
                }).join('') + '</ul>';
        }

        function renderWorkout() {
            const content = document.getElementById('workout-content');

            if (!appState.todayWorkout) {
                content.innerHTML = '<p class="loading">Generating your personalized workout...</p>';
                generateTodayWorkout();
                return;
            }

            let activities = [];
            try {
                activities = typeof appState.todayWorkout.activities === 'string'
                    ? JSON.parse(appState.todayWorkout.activities)
                    : (appState.todayWorkout.activities || []);
            } catch (e) { activities = []; }

            if (appState.todayWorkout.day_focus) {
                html += '<div class="day-badge">' + appState.todayWorkout.day_focus + '</div>';
            }

            html += '<h3 style="margin-top:0;">' + appState.todayWorkout.title + '</h3>';
            html += '<p style="margin-bottom:1.5rem;color:var(--neutral);">' + appState.todayWorkout.overview + '</p>';

            // Stats row
            const totalMins = activities.reduce(function(sum, a) {
                const mins = parseInt(a.duration) || 0;
                return sum + mins;
            }, 0);

            html += '<div class="stat-grid">';
            html += '<div class="stat-card"><div class="stat-num">' + activities.length + '</div><div class="stat-label">Exercises</div></div>';
            html += '<div class="stat-card"><div class="stat-num">' + (totalMins || '30') + '</div><div class="stat-label">Minutes</div></div>';
            html += '<div class="stat-card"><div class="stat-num">' + (appState.currentLocation ? (appState.currentLocation.location === 'home' ? '🏠' : '🏡') : '📍') + '</div><div class="stat-label">' + (appState.currentLocation ? (appState.currentLocation.location === 'home' ? 'Home' : 'Karmel') : 'Location') + '</div></div>';
            html += '</div>';

            activities.forEach(function(activity) {
                html += '<div class="workout-activity">';
                html += '<h4>' + activity.name + '</h4>';
                html += '<div class="meta"><div class="meta-item">⏱️ ' + activity.duration + '</div>';
                if (activity.sets) html += '<div class="meta-item">🔄 ' + activity.sets + '</div>';
                if (activity.reps) html += '<div class="meta-item">💪 ' + activity.reps + '</div>';
                if (activity.weight) html += '<div class="meta-item">🏋️ ' + activity.weight + '</div>';
                html += '</div>';
                html += '<p style="margin-bottom:0.25rem;"><strong>What to do:</strong></p>' + formatAsBullets(activity.description);
                html += '<p style="margin-top:0.75rem;margin-bottom:0.25rem;"><strong>Form:</strong></p>' + formatAsBullets(activity.form);
                if (activity.videoUrl) {
                    html += '<p style="margin-top:0.5rem;"><a href="' + activity.videoUrl + '" target="_blank" style="color:var(--accent);">📹 Watch form video</a></p>';
                }
                html += '</div>';
            });

            content.innerHTML = html;
        }

        function copyWorkout() {
            if (!appState.todayWorkout) return;
            let activities = [];
            try {
                activities = typeof appState.todayWorkout.activities === 'string'
                    ? JSON.parse(appState.todayWorkout.activities)
                    : (appState.todayWorkout.activities || []);
            } catch (e) { activities = []; }

            const lines = [appState.todayWorkout.title, ''].concat(
                activities.map(a => '• ' + a.name + ' (' + a.duration + ')' + (a.sets ? ' — ' + a.sets + ' sets' : '') + (a.reps ? ' x ' + a.reps : '') + ': ' + a.description)
            );
            navigator.clipboard.writeText(lines.join('\n')).then(function() {
                const btn = document.querySelector('[onclick="copyWorkout()"]');
                if (btn) {
                    const orig = btn.textContent;
                    btn.textContent = '✓ Copied!';
                    setTimeout(function() { btn.textContent = orig; }, 2000);
                }
            });
        }

        async function generateTodayWorkout() {
            try {
                const prompt = buildWorkoutPrompt();
                const response = await callClaude(prompt);

                const titleMatch     = response.match(/WORKOUT_TITLE:\s*(.+?)(?=\nOVERVIEW:|$)/s);
                const overviewMatch  = response.match(/OVERVIEW:\s*(.+?)(?=\nFOCUS:|$)/s);
                const focusMatch     = response.match(/FOCUS:\s*(.+?)(?=\nACTIVITIES:|$)/s);
                const activitiesMatch = response.match(/ACTIVITIES:\s*([\s\S]+?)(?=\n\n$|$)/);

                const title    = titleMatch    ? titleMatch[1].trim()    : "Today's Workout";
                const overview = overviewMatch ? overviewMatch[1].trim() : 'Personalized workout';
                const focus    = focusMatch    ? focusMatch[1].trim()    : '';

                const activitiesText = activitiesMatch ? activitiesMatch[1].trim() : '';
                const activityBlocks = activitiesText.split(/\n(?=-)/).filter(a => a.trim());
                const activities = activityBlocks.map(function(block) {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                    const nameLine = (lines[0] || 'Activity').replace(/^-\s*/, '');

                    // Parse sets/reps/weight from second line if present
                    const metaLine = lines[1] || '';
                    const durationMatch = metaLine.match(/(\d+\s*(?:min|minutes|seconds|secs))/i);
                    const setsMatch = metaLine.match(/(\d+)\s*sets?/i);
                    const repsMatch = metaLine.match(/(\d+)(?:-(\d+))?\s*reps?/i);
                    const weightMatch = metaLine.match(/(\d+(?:\.\d+)?)\s*(?:lb|lbs|kg|pound)/i);

                    return {
                        name:        nameLine,
                        duration:    durationMatch ? durationMatch[1] : metaLine || '10 min',
                        sets:        setsMatch ? setsMatch[1] + ' sets' : null,
                        reps:        repsMatch ? repsMatch[1] + (repsMatch[2] ? '-' + repsMatch[2] : '') + ' reps' : null,
                        weight:      weightMatch ? weightMatch[1] + 'lb' : null,
                        description: lines[2] || 'Do this exercise',
                        form:        lines[3] || 'Proper form',
                        videoUrl:    null
                    };
                });

                const workoutData = {
                    date:       appState.currentDate,
                    title:      title,
                    overview:   overview,
                    day_focus:  focus,
                    activities: JSON.stringify(activities),
                    created_at: new Date().toISOString()
                };

                await supabaseClient
                    .from('travelstrongworkouts')
                    .upsert([workoutData], { onConflict: 'date' });

                appState.todayWorkout = workoutData;
                appState.allWorkouts = appState.allWorkouts.filter(w => w.date !== appState.currentDate);
                appState.allWorkouts.unshift(workoutData);

                renderWorkout();

            } catch (err) {
                console.error('Error generating workout:', err);
                const content = document.getElementById('workout-content');
                if (content) content.innerHTML = '<p class="msg-error">Error generating workout. Please try again.</p>';
            }
        }

inutes total, mobility built in)\n';

        // ── Claude API ────────────────────────────────────────────────────────
        async function callClaude(prompt) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appId: APP_ID,
                    method: 'CLAUDE_API',
                    claudeMethod: 'advisorChat',
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await response.json();
            return data.result || '';
        }

        async function callClaudeChat(systemPrompt, messages) {
            const fullMessages = [
                { role: 'user', content: systemPrompt + '\n\n---\n\nBegin the check-in based on the conversation that follows.' },
                { role: 'assistant', content: 'Understood. I am ready to conduct the morning check-in as Ed\'s personal trainer.' }
            ].concat(messages);

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appId: APP_ID,
                    method: 'CLAUDE_API',
                    claudeMethod: 'advisorChat',
                    messages: fullMessages
                })
            });
            const data = await response.json();
            return data.result || '';
        }

                html += '<p class="msg-error">No assessment data found.</p>';
            }

            html += '<p style="margin-top:2rem;font-size:0.8rem;color:var(--neutral);border-top:1px solid #E0E8F0;padding-top:1rem;">Be Strong v1.0.0 &nbsp;|&nbsp; Build 2026-08-19</p>';
            content.innerHTML = html;
        }

        // ── Service Worker ────────────────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        }
    </script>
</body>
</html>
