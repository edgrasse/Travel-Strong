<!DOCTYPE html>
<!-- Version: 2.0.0 | Deployed: 2026-05-07_02-57-45 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Strong</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travel Strong">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #3D2B1F;
            --accent: #C4773B;
            --light: #FAF7F2;
            --neutral: #9A8B7E;
            --success: #6B9E7F;
            --warning: #D4A574;
            --error: #C65D5D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--primary);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        nav {
            width: 200px;
            background: white;
            padding: 2rem 1rem;
            border-right: 1px solid #e0e0e0;
        }

        nav button {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            text-align: left;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        nav button:hover {
            background: var(--light);
        }

        nav button.active {
            background: var(--light);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        main {
            flex: 1;
            padding: 2rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--accent);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        h3 {
            font-size: 1.2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, textarea, select {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            margin-bottom: 1rem;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #b8652e;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--neutral);
        }

        .error {
            background: #ffe0e0;
            color: var(--error);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .success {
            background: #e0ffe0;
            color: var(--success);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .question {
            background: var(--light);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .question p {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .workout-activity {
            background: var(--light);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--success);
        }

        .workout-activity h4 {
            margin-bottom: 0.5rem;
        }

        .meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .meta-item {
            font-size: 0.9rem;
            color: var(--neutral);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            nav {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                display: flex;
                overflow-x: auto;
                padding: 1rem 0;
            }

            nav button {
                white-space: nowrap;
                flex: 0 0 auto;
                padding: 0.75rem 1rem;
                margin-right: 0.5rem;
                margin-bottom: 0;
            }

            header h1 {
                font-size: 1.75rem;
            }

            main {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Travel Strong</h1>
        <p>AI-Adaptive Fitness Training for Scandinavia & Ireland</p>
    </header>

    <div class="container">
        <nav id="navigation">
            <button class="nav-btn active" data-view="assessment">Initial Assessment</button>
            <button class="nav-btn" data-view="checkin">Morning Check-In</button>
            <button class="nav-btn" data-view="workout">Today's Workout</button>
            <button class="nav-btn" data-view="history">History</button>
            <button class="nav-btn" data-view="settings">Settings</button>
        </nav>

        <main id="main-content">
            <!-- Assessment View -->
            <div id="assessment-view" class="view active">
                <div class="card">
                    <h2>Initial Assessment</h2>
                    <div id="assessment-content">
                        <p class="loading">Loading assessment...</p>
                    </div>
                </div>
            </div>

            <!-- Morning Check-In View -->
            <div id="checkin-view" class="view">
                <div class="card">
                    <h2>Morning Check-In</h2>
                    <div id="checkin-content">
                        <p class="loading">Loading check-in...</p>
                    </div>
                </div>
            </div>

            <!-- Today's Workout View -->
            <div id="workout-view" class="view">
                <div class="card">
                    <h2>Today's Workout</h2>
                    <div id="workout-content">
                        <p class="loading">Loading workout...</p>
                    </div>
                </div>
            </div>

            <!-- History View -->
            <div id="history-view" class="view">
                <div class="card">
                    <h2>History</h2>
                    <div id="history-content">
                        <p class="loading">Loading history...</p>
                    </div>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="view">
                <div class="card">
                    <h2>Settings</h2>
                    <div id="settings-content">
                        <p>Profile information and app settings go here.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://viprflxaudxjwsvytrnn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcHJmbHhhdWR4andzdnl0cm5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Nzc0NjcsImV4cCI6MjA5MDE1MzQ2N30.GCaasqLjpBvcARUO7poDTKH_bvQfasbAX9yLKOeKGK0';
        const WORKER_URL = 'https://grasse-apps-proxy.ed-53c.workers.dev';
        const APP_ID = 'travelstrong';

        let supabaseClient = null;
        let appState = {
            profile: null,
            assessmentAnswers: [],
            todayWorkout: null,
            todayCheckin: null,
            allWorkouts: [],
            allCheckins: [],
            currentDate: new Date().toISOString().split('T')[0]
        };

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            setupNavigation();
            await loadData();
            renderAssessment();
        });

        function setupNavigation() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const view = e.target.dataset.view;
                    switchView(view);
                });
            });
        }

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`${viewName}-view`).classList.add('active');
            event.target.classList.add('active');

            if (viewName === 'assessment') renderAssessment();
            if (viewName === 'checkin') renderCheckin();
            if (viewName === 'workout') renderWorkout();
            if (viewName === 'history') renderHistory();
        }

        async function loadData() {
            try {
                // Load profile and assessment answers
                const { data: profileData } = await supabaseClient
                    .from('travelstrongusers')
                    .select('*')
                    .limit(1)
                    .single();

                if (profileData) {
                    appState.profile = profileData;
                    appState.assessmentAnswers = [
                        profileData.answer_1 || '',
                        profileData.answer_2 || '',
                        profileData.answer_3 || '',
                        profileData.answer_4 || '',
                        profileData.answer_5 || ''
                    ];
                }

                // Load all workouts
                const { data: workoutData } = await supabaseClient
                    .from('travelstrongworkouts')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allWorkouts = workoutData || [];

                // Load all check-ins
                const { data: checkinData } = await supabaseClient
                    .from('travelstrongcheckins')
                    .select('*')
                    .order('date', { ascending: false });

                appState.allCheckins = checkinData || [];

                // Check if we have a check-in for today
                appState.todayCheckin = appState.allCheckins.find(c => c.date === appState.currentDate);

                // Check if we have a workout for today
                appState.todayWorkout = appState.allWorkouts.find(w => w.date === appState.currentDate);

            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        function renderAssessment() {
            const content = document.getElementById('assessment-content');
            if (!appState.assessmentAnswers.length) {
                content.innerHTML = '<p class="loading">No assessment found.</p>';
                return;
            }

            const questions = [
                'How are your knees and hips feeling these days?',
                "Let's talk about your lower back and hips specifically. Do you experience any lower back stiffness or aching?",
                "Let's talk about your ankles and feet. Do your ankles feel stable on uneven ground?",
                'When you think about those long walking days, how does your cardiovascular system hold up?',
                'Are there any upper body issues I should know about - shoulder, elbow, wrist?'
            ];

            let html = '<div>';
            questions.forEach((q, i) => {
                html += `
                    <div class="question">
                        <p><strong>Q${i+1}: ${q}</strong></p>
                        <p>${appState.assessmentAnswers[i]}</p>
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        function renderCheckin() {
            const content = document.getElementById('checkin-content');
            
            if (!appState.todayWorkout) {
                content.innerHTML = '<p class="error">No workout generated yet. Please check back later.</p>';
                return;
            }

            if (appState.todayCheckin && appState.todayCheckin.answers && appState.todayCheckin.answers.length > 0) {
                // Already answered today
                let html = '<div class="success">You\'ve already checked in today!</div>';
                appState.todayCheckin.questions.forEach((q, i) => {
                    html += `
                        <div class="question">
                            <p><strong>${q}</strong></p>
                            <p>${appState.todayCheckin.answers[i]}</p>
                        </div>
                    `;
                });
                content.innerHTML = html;
                return;
            }

            // Show form for today's dynamic questions
            let html = '<form id="checkin-form">';
            if (appState.todayCheckin && appState.todayCheckin.questions) {
                appState.todayCheckin.questions.forEach((q, i) => {
                    html += `
                        <div class="question">
                            <label for="answer-${i}"><strong>${q}</strong></label>
                            <textarea id="answer-${i}" placeholder="Your answer..."></textarea>
                        </div>
                    `;
                });
            }
            html += '<button type="submit">Save Check-In</button>';
            html += '</form>';
            content.innerHTML = html;

            document.getElementById('checkin-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveCheckin();
            });
        }

        async function saveCheckin() {
            const answers = [];
            const form = document.getElementById('checkin-form');
            const textareas = form.querySelectorAll('textarea');
            textareas.forEach(ta => answers.push(ta.value));

            try {
                const checkinData = {
                    date: appState.currentDate,
                    workout_id: appState.todayWorkout.date,
                    questions: appState.todayCheckin.questions,
                    answers: answers,
                    updated_at: new Date().toISOString()
                };

                const { error } = await supabaseClient
                    .from('travelstrongcheckins')
                    .upsert([checkinData], { onConflict: 'date' });

                if (!error) {
                    document.getElementById('checkin-content').innerHTML = '<p class="success">Check-in saved! Your workout for tomorrow will be generated.</p>';
                    // Generate tomorrow's workout
                    setTimeout(() => generateTodayWorkout(), 2000);
                }
            } catch (err) {
                alert('Error saving check-in: ' + err.message);
            }
        }

        function renderWorkout() {
            const content = document.getElementById('workout-content');
            
            if (!appState.todayWorkout) {
                content.innerHTML = '<p class="loading">Generating your personalized workout...</p>';
                generateTodayWorkout();
                return;
            }

            let html = `
                <h3>${appState.todayWorkout.title}</h3>
                <p>${appState.todayWorkout.overview}</p>
            `;

            if (appState.todayWorkout.activities) {
                const activities = typeof appState.todayWorkout.activities === 'string' 
                    ? JSON.parse(appState.todayWorkout.activities) 
                    : appState.todayWorkout.activities;

                activities.forEach(activity => {
                    html += `
                        <div class="workout-activity">
                            <h4>${activity.name}</h4>
                            <div class="meta">
                                <div class="meta-item">⏱️ ${activity.duration}</div>
                            </div>
                            <p><strong>What to do:</strong> ${activity.description}</p>
                            <p><strong>Form:</strong> ${activity.form}</p>
                            ${activity.videoUrl ? `<p><a href="${activity.videoUrl}" target="_blank">📹 View form video</a></p>` : ''}
                        </div>
                    `;
                });
            }

            content.innerHTML = html;
        }

        async function generateTodayWorkout() {
            try {
                const prompt = buildWorkoutPrompt();
                const response = await callClaude(prompt);
                
                let parsed = response;
                if (typeof response === 'string') {
                    const jsonMatch = response.match(/\{[\s\S]*\}/);
                    parsed = JSON.parse(jsonMatch[0]);
                }

                const workoutData = {
                    date: appState.currentDate,
                    title: parsed.workout.title,
                    overview: parsed.workout.overview,
                    activities: JSON.stringify(parsed.workout.activities),
                    created_at: new Date().toISOString()
                };

                await supabaseClient
                    .from('travelstrongworkouts')
                    .upsert([workoutData], { onConflict: 'date' });

                // Save tomorrow's check-in questions
                const tomorrow = new Date(appState.currentDate);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowDate = tomorrow.toISOString().split('T')[0];

                const checkinData = {
                    date: tomorrowDate,
                    workout_id: workoutData.date,
                    questions: parsed.tomorrow_checkin_questions || [],
                    answers: [],
                    updated_at: new Date().toISOString()
                };

                await supabaseClient
                    .from('travelstrongcheckins')
                    .upsert([checkinData], { onConflict: 'date' });

                appState.todayWorkout = workoutData;
                renderWorkout();

            } catch (err) {
                console.error('Error generating workout:', err);
                document.getElementById('workout-content').innerHTML = '<p class="error">Error generating workout. Please try again.</p>';
            }
        }

        function buildWorkoutPrompt() {
            const assessment = appState.assessmentAnswers.join('\n\n');
            const history = appState.allCheckins
                .filter(c => c.answers && c.answers.length > 0)
                .reverse()
                .map(c => `Date: ${c.date}\nQuestions & Answers:\n${c.questions.map((q, i) => `${q}\nAnswer: ${c.answers[i]}`).join('\n\n')}`)
                .join('\n\n---\n\n');

            return `You are an expert fitness coach preparing someone for 11 days of walking in Scandinavia and 7 days of golf in Ireland.

PROFILE:
- Name: ${appState.profile?.name || 'User'}
- Stats: ${appState.profile?.stats || 'Unknown'}
- Fitness Level: ${appState.profile?.fitness_level || 'Unknown'}
- Departure: ${appState.profile?.departure_date || 'Unknown'}

INITIAL ASSESSMENT (from 5-question interview):
${assessment}

HISTORY OF WORKOUTS AND CHECK-INS (user's progress so far):
${history || 'No prior workouts yet - this is day 1'}

REQUIREMENTS:
1. Generate a 25-30 minute personalized workout
2. Based on assessment + user's progress/feedback
3. Bodyweight only, NO PUSHUPS (shoulder injury)
4. Emphasize: ankle mobility, knee stability, core, hip flexibility
5. Include walking recommendation

ALSO GENERATE:
3-4 dynamic check-in questions for tomorrow based on today's workout focus

Return ONLY valid JSON:
{
  "workout": {
    "title": "Workout Title",
    "overview": "Brief summary of today's focus",
    "activities": [
      {
        "name": "Activity Name",
        "duration": "X minutes",
        "description": "What to do",
        "form": "How to do it correctly",
        "videoUrl": "https://youtube.com/..." or null
      }
    ]
  },
  "tomorrow_checkin_questions": [
    "Question 1 based on today's focus",
    "Question 2",
    "Question 3"
  ]
}`;
        }

        async function callClaude(prompt) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appId: APP_ID,
                    method: 'CLAUDE_API',
                    claudeMethod: 'advisorChat',
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            const data = await response.json();
            return data.result || '';
        }

        function renderHistory() {
            const content = document.getElementById('history-content');
            
            if (!appState.allWorkouts.length) {
                content.innerHTML = '<p>No workout history yet.</p>';
                return;
            }

            let html = '<div>';
            appState.allWorkouts.forEach(workout => {
                const checkin = appState.allCheckins.find(c => c.date === workout.date);
                html += `
                    <div class="card">
                        <h3>${workout.date}</h3>
                        <p><strong>${workout.title}</strong></p>
                        <p>${workout.overview}</p>
                        ${checkin && checkin.answers && checkin.answers.length > 0 ? `
                            <h4 style="margin-top: 1rem;">Your Feedback:</h4>
                            ${checkin.questions.map((q, i) => `
                                <div class="question">
                                    <p><strong>${q}</strong></p>
                                    <p>${checkin.answers[i]}</p>
                                </div>
                            `).join('')}
                        ` : '<p><em>No check-in feedback yet</em></p>'}
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
